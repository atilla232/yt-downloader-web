<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0f0f0f; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1f1f1f; width: 100%; max-width: 480px; padding: 28px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid #333; }
        h2 { text-align: center; color: #ff0000; margin-bottom: 20px; font-size: 1.6rem; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #bbb; margin-bottom: 6px; font-weight: 600; }
        input[type="text"], select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background-color: #2b2b2b; color: #fff; font-size: 14px; outline: none; }
        input[type="text"]:focus, select:focus { border-color: #ff0000; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-submit { width: 100%; padding: 14px; background-color: #ff0000; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background-color: #cc0000; }
        .btn-submit:disabled { background-color: #555; cursor: not-allowed; }
        .status { margin-top: 15px; text-align: center; font-size: 14px; color: #aaa; display: none; }
        .result-card { display: none; margin-top: 20px; background: #282828; padding: 16px; border-radius: 10px; text-align: center; }
        .result-card img { width: 100%; border-radius: 8px; margin-bottom: 12px; }
        .btn-download { display: inline-block; width: 100%; padding: 12px; background-color: #28a745; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px; }
        .btn-download:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>YouTube Downloader</h2>
    
    <div class="input-group">
        <label for="urlInput">URL Video YouTube:</label>
        <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
    </div>

    <div class="options-grid">
        <div>
            <label for="formatSelect">Format:</label>
            <select id="formatSelect" onchange="toggleQuality()">
                <option value="mp4">Video (MP4)</option>
                <option value="mp3">Audio Only (MP3)</option>
            </select>
        </div>
        <div>
            <label for="qualitySelect">Resolusi:</label>
            <select id="qualitySelect">
                <option value="1080">1080p</option>
                <option value="720" selected>720p</option>
                <option value="480">480p</option>
                <option value="360">360p</option>
            </select>
        </div>
    </div>

    <button id="submitBtn" class="btn-submit" onclick="processVideo()">PROSES VIDEO</button>

    <div id="status" class="status">⏳ Memproses video... Mohon tunggu.</div>

    <div id="resultCard" class="result-card">
        <img id="thumbPreview" src="" alt="Thumbnail">
        <p style="color: #4cd137; font-weight: bold;">✅ File Siap Diunduh!</p>
        <a id="downloadBtn" class="btn-download" target="_blank" rel="noopener noreferrer">UNDUH SEKARANG</a>
    </div>
</div>

<script>
    function toggleQuality() {
        const format = document.getElementById('formatSelect').value;
        document.getElementById('qualitySelect').disabled = (format === 'mp3');
    }

    function extractVideoID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    async function processVideo() {
        const url = document.getElementById('urlInput').value.trim();
        const format = document.getElementById('formatSelect').value;
        const quality = document.getElementById('qualitySelect').value;
        
        const submitBtn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        const resultCard = document.getElementById('resultCard');
        const downloadBtn = document.getElementById('downloadBtn');
        const thumbPreview = document.getElementById('thumbPreview');

        if (!url) return alert('Silakan masukkan URL YouTube terlebih dahulu!');
        
        const videoId = extractVideoID(url);
        if (!videoId) return alert('URL YouTube tidak valid!');

        submitBtn.disabled = true;
        status.style.display = 'block';
        resultCard.style.display = 'none';

        let downloadUrl = null;

        // METODE 1: Cobalt Official API (dengan trailing slash / agar tidak redirect)
        try {
            const response = await fetch('https://api.cobalt.tools/', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: url,
                    videoQuality: quality,
                    downloadMode: format === 'mp3' ? 'audio' : 'auto'
                })
            });

            if (response.ok) {
                const data = await response.json();
                if (data.url) downloadUrl = data.url;
                else if (data.picker && data.picker.length > 0) downloadUrl = data.picker[0].url;
            }
        } catch (e) {
            console.log('Cobalt API Error:', e);
        }

        // METODE 2: Fallback ke Piped Stream API (jika Cobalt gagal)
        if (!downloadUrl) {
            const pipedEndpoints = [
                'https://pipedapi.kavin.rocks',
                'https://api.piped.yt'
            ];

            for (const ep of pipedEndpoints) {
                try {
                    const res = await fetch(`${ep}/streams/${videoId}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (format === 'mp3' && data.audioStreams && data.audioStreams.length > 0) {
                            downloadUrl = data.audioStreams[0].url;
                            break;
                        } else if (data.videoStreams && data.videoStreams.length > 0) {
                            const stream = data.videoStreams.find(s => !s.videoOnly) || data.videoStreams[0];
                            if (stream && stream.url) {
                                downloadUrl = stream.url;
                                break;
                            }
                        }
                    }
                } catch (e) {
                    // Lanjut ke endpoint berikutnya
                }
            }
        }

        submitBtn.disabled = false;
        status.style.display = 'none';

        if (downloadUrl) {
            thumbPreview.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            downloadBtn.href = downloadUrl;
            resultCard.style.display = 'block';
        } else {
            alert('Gagal mengambil link video. Server API sedang memblokir akses atau video dibatasi.');
        }
    }
</script>

</body>
</html>
